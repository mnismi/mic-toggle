[package]
name = "mic-toggle"
version = "0.1.0"
edition = "2021"
description = "Mute/unmute the default microphone with a global hotkey — tiny native Windows tray app"
repository = "https://github.com/mnismi/mic-toggle"
license = "MIT"
readme = "README.md"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
